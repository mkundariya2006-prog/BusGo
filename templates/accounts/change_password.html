{% extends 'base.html' %}

{% block title %}Change Password | BusGo{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card-modern p-4 p-md-5">
        <h4 class="fw-bold text-dark mb-3"><i class="fa-solid fa-key text-warning me-2"></i> Change Password</h4>
        <form method="POST">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <small class="text-danger d-block mt-1">{{ field.errors.0 }}</small>
              {% endif %}
            </div>
          {% endfor %}
          <div class="d-flex gap-2 mt-4">
            <a href="{% url 'accounts:profile' %}" class="btn btn-light rounded-pill px-3">Cancel</a>
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold flex-grow-1">Update Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
